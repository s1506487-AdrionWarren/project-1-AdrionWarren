<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Color Hunting</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-strip"></div>

    <main class="website">

       
        <section class="color-palette" aria-label="Color palette">
            <div class="color blue"></div>

            <div class="color steel-blue"></div>

            <div class="color teal"></div>

            <div class="color turquoise"></div>
            
        </section>

      
        <header class="title">
            <h1>Color Hunting</h1>
            <p>What is Color Hunting?</p>
        </header>

       
        <section class="introduction">
            <p>
                Color Hunting is where people hunt for one color
                by taking pictures of things.
            </p>
        </section>

       
        <section class="instructions">
            <p>
                Let it lead your eyes to objects, city, parks
                or other things that have the same color.
                Scavenge many colors that are the same.
            </p>
        </section>

    
        <section class="picture-section">
            <img
                src="images/Green color hunt pictures.jpg"
                alt="A collage of green objects and scenery"
            >
        </section>

    </main>

</body>
</html>
